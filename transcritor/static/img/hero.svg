<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="vidro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b" stop-opacity=".92"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity=".92"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".28"/>
    </filter>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>


  <!-- cartão do audio (estilo mensagem de voz) -->
  <g filter="url(#sombra)">
    <rect x="40" y="70" width="300" height="96" rx="26" fill="url(#vidro)" stroke="#ffffff" stroke-opacity=".22"/>
    <circle cx="90" cy="118" r="26" fill="url(#g1)"/>
    <path d="M84 106 L100 118 L84 130 Z" fill="#fff"/>
    <g fill="url(#g2)">
      <rect x="132" y="108" width="7" height="20" rx="3.5"/>
      <rect x="145" y="98"  width="7" height="40" rx="3.5"/>
      <rect x="158" y="90"  width="7" height="56" rx="3.5"/>
      <rect x="171" y="102" width="7" height="32" rx="3.5"/>
      <rect x="184" y="94"  width="7" height="48" rx="3.5"/>
      <rect x="197" y="106" width="7" height="24" rx="3.5"/>
      <rect x="210" y="96"  width="7" height="44" rx="3.5"/>
      <rect x="223" y="88"  width="7" height="60" rx="3.5"/>
      <rect x="236" y="100" width="7" height="36" rx="3.5"/>
      <rect x="249" y="108" width="7" height="20" rx="3.5"/>
      <rect x="262" y="102" width="7" height="32" rx="3.5"/>
      <rect x="275" y="110" width="7" height="16" rx="3.5"/>
    </g>
    <text x="300" y="124" font-family="Inter,Segoe UI,sans-serif" font-size="14" fill="#cbd5e1">1:24</text>
  </g>

  <!-- seta magica -->
  <path d="M250 190 C 290 210, 300 230, 300 252" stroke="url(#g2)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/>
  <path d="M290 246 L300 262 L312 247" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fde68a">
    <path d="M330 196 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/>
    <path d="M205 238 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" opacity=".8"/>
  </g>

  <!-- cartao de texto transcrito -->
  <g filter="url(#sombra)">
    <rect x="190" y="270" width="330" height="120" rx="26" fill="url(#vidro)" stroke="#ffffff" stroke-opacity=".22"/>
    <rect x="216" y="296" width="44" height="18" rx="9" fill="#10b981" opacity=".9"/>
    <text x="224" y="309" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#fff">00:04</text>
    <rect x="272" y="298" width="210" height="14" rx="7" fill="#e2e8f0" opacity=".85"/>
    <rect x="216" y="326" width="270" height="14" rx="7" fill="#e2e8f0" opacity=".6"/>
    <rect x="216" y="352" width="180" height="14" rx="7" fill="#e2e8f0" opacity=".4"/>
    <rect x="404" y="350" width="3" height="18" rx="1.5" fill="#22d3ee"/>
  </g>
</svg>
