services:
  - type: web
    name: meus-investimentos
    runtime: node
    plan: free               # ATENCAO: no plano free nao existe disco persistente.
    buildCommand: "npm install --omit=dev"   # instala o driver pg (banco Supabase)
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Credenciais do app criado em https://developers.mercadolivre.com.br
      # Preencha os valores no painel do Render (Environment), nao aqui no repositorio.
      - key: ML_CLIENT_ID
        sync: false
      - key: ML_CLIENT_SECRET
        sync: false
      # String de conexao do Supabase (Connect -> Session pooler). Sem ela, o site usa o SQLite local.
      - key: DATABASE_URL
        sync: false
      # Token do agente coletor: e o que autoriza a escrita (o site nao tem login).
      # Preencha o valor no painel do Render (Environment), nao aqui no repositorio.
      - key: COLETOR_TOKEN
        sync: false

  # Transcritor de audio/video + compactador para WhatsApp (pasta transcritor/).
  # A compactacao roda no navegador (ffmpeg.wasm); o servidor so faz login e chama a Groq.
  - type: web
    name: transcritor
    runtime: python
    plan: free
    rootDir: transcritor
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 330
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Chave criada em https://console.groq.com/keys (preencha no painel do Render)
      - key: GROQ_API_KEY
        sync: false
      # Senha para entrar no site (preencha no painel do Render)
      - key: APP_SENHA
        sync: false
      - key: SECRET_KEY
        generateValue: true
