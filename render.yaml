services:
  - type: web
    name: meus-investimentos
    runtime: node
    plan: free               # ATENCAO: no plano free nao existe disco persistente.
    buildCommand: ""         # sem dependencias para instalar
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
